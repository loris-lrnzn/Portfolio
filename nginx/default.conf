# ── pb.lorislorenzini.fr HTTP → HTTPS + certbot ───────────────────────
server {
    listen 80;
    server_name pb.lorislorenzini.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── pb.lorislorenzini.fr HTTPS → PocketBase ───────────────────────────
server {
    listen 443 ssl;
    server_name pb.lorislorenzini.fr;

    ssl_certificate     /etc/letsencrypt/live/pb.lorislorenzini.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pb.lorislorenzini.fr/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass         http://pocketbase:8090;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (SSE temps réel PocketBase)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}

# ── Redirection HTTP → HTTPS ──────────────────────────────────────────
server {
    listen 80;
    server_name lorislorenzini.fr www.lorislorenzini.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name lorislorenzini.fr www.lorislorenzini.fr;

    client_max_body_size 20M;

    # ── Compression ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    ssl_certificate     /etc/letsencrypt/live/lorislorenzini.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lorislorenzini.fr/privkey.pem;

    # ── Frontend React SPA ────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache long terme pour les assets Vite (hash dans le nom de fichier)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Sitemap généré par Symfony (inclut tous les projets) ─────────
    location = /sitemap.xml {
        proxy_pass         http://symfony:8000/sitemap.xml;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Backend Symfony (/api/ et /uploads/) ─────────────────────────
    location /api/ {
        proxy_pass         http://symfony:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ^~ /uploads/ {
        proxy_pass         http://symfony:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 30s;

        # Les noms de fichiers sont uniques : cache long terme
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ── Chatbot Django (/chatbot/) ────────────────────────────────────
    location /chatbot/ {
        proxy_pass         http://chatbot:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
